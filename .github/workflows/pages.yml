name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_REDIRECT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      VITE_GITHUB_REPOSITORY: ${{ github.repository }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_REQUIRE_AUTH_CONFIG: "true"
      VITE_APP_TARGET: web
    steps:
      - uses: actions/checkout@v4
      - name: Protect the existing portfolio site
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          portfolio_repo="${GITHUB_REPOSITORY_OWNER}.github.io"
          if [ "$repo_name" = "$portfolio_repo" ]; then
            echo "This workflow must run from a project repository such as dongni-market-studio, not the portfolio root repository $portfolio_repo."
            exit 1
          fi
          if [ -f public/CNAME ] || [ -f CNAME ]; then
            echo "A CNAME file could replace an existing custom-domain mapping. Remove it before deploying this project."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
