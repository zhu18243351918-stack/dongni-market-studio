[package]
name = "dongni-market-studio"
version = "1.0.0"
description = "东尼菜市场本地优先图片编辑器"
authors = ["Dongni Market Studio"]
edition = "2021"

[lib]
name = "dongni_market_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
