<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">东尼菜市场新版功能</title>
  <desc id="description">网页与Windows双版本、原图本地保存、大图低清预览、后台线程处理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f3"/>
      <stop offset="1" stop-color="#deded8"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f1d8ba"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".14"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="960" height="720" rx="42" fill="url(#bg)"/>
  <rect width="960" height="720" rx="42" fill="url(#dots)" opacity=".45"/>

  <g transform="translate(56 50)">
    <g transform="translate(0 2) rotate(-8 18 18)" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 10c7 0 14 5 16 12-7 12-15 22-25 29-4-11-2-24 9-41Z"/>
      <path d="m17 11 4-8m1 10 8-6m-17 16 10 5M8 34l10 4"/>
    </g>
    <text x="50" y="27" fill="#0b0b0b" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700">东尼菜市场</text>
    <text x="190" y="27" fill="#777" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">VERSION 2.0</text>
  </g>

  <text x="56" y="143" fill="#111" font-family="Microsoft YaHei,Arial,sans-serif" font-size="36" font-weight="500" letter-spacing="-1.2">大图编辑，更轻更快</text>
  <text x="58" y="176" fill="#666" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15">原图留在设备里，编辑、撤销与导出各司其职。</text>

  <g transform="translate(56 215)" filter="url(#shadow)">
    <rect width="848" height="342" rx="28" fill="#fafafa" stroke="#000" stroke-opacity=".1"/>
    <rect width="848" height="48" rx="28" fill="#fff"/>
    <rect y="24" width="848" height="24" fill="#fff"/>
    <circle cx="24" cy="24" r="5" fill="#111" opacity=".16"/>
    <circle cx="42" cy="24" r="5" fill="#111" opacity=".1"/>
    <circle cx="60" cy="24" r="5" fill="#111" opacity=".07"/>
    <rect x="88" y="13" width="96" height="22" rx="11" fill="#111"/>
    <text x="112" y="28" fill="#fff" font-family="Microsoft YaHei,Arial,sans-serif" font-size="9">东尼菜市场</text>
    <rect x="692" y="11" width="62" height="26" rx="13" fill="#f0f0f1"/>
    <text x="711" y="28" fill="#333" font-family="Arial,sans-serif" font-size="9">68%</text>
    <rect x="764" y="11" width="70" height="26" rx="13" fill="#111"/>
    <text x="782" y="28" fill="#fff" font-family="Microsoft YaHei,Arial,sans-serif" font-size="9">导出</text>

    <rect x="14" y="60" width="52" height="268" rx="20" fill="#fff" stroke="#000" stroke-opacity=".08"/>
    <rect x="22" y="70" width="36" height="36" rx="13" fill="#111"/>
    <path d="M34 81 47 88l-8 3-3 8Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#111" opacity=".32">
      <circle cx="40" cy="128" r="10"/><rect x="30" y="153" width="20" height="20" rx="5"/><circle cx="40" cy="198" r="10"/><rect x="30" y="224" width="20" height="20" rx="5"/>
    </g>

    <rect x="78" y="60" width="570" height="268" rx="20" fill="#eceef0"/>
    <rect x="78" y="60" width="570" height="268" rx="20" fill="url(#dots)"/>
    <rect x="151" y="84" width="424" height="220" rx="10" fill="url(#canvas)" stroke="#111" stroke-opacity=".22" stroke-dasharray="5 5"/>
    <text x="151" y="77" fill="#111" font-family="Microsoft YaHei,Arial,sans-serif" font-size="9" font-weight="700">商品主图 · 1080 × 1080</text>
    <circle cx="283" cy="182" r="66" fill="#f97316" opacity=".9"/>
    <rect x="333" y="127" width="178" height="110" rx="18" fill="#fff" opacity=".9"/>
    <rect x="355" y="151" width="112" height="11" rx="5.5" fill="#111"/>
    <rect x="355" y="174" width="76" height="8" rx="4" fill="#111" opacity=".28"/>
    <rect x="355" y="193" width="96" height="8" rx="4" fill="#111" opacity=".16"/>
    <rect x="355" y="218" width="62" height="24" rx="12" fill="#111"/>
    <rect x="515" y="286" width="112" height="30" rx="15" fill="#fff" stroke="#000" stroke-opacity=".12"/>
    <text x="537" y="305" fill="#111" font-family="Arial,sans-serif" font-size="9">− 68% ＋</text>

    <rect x="660" y="60" width="174" height="268" rx="20" fill="#fff" stroke="#000" stroke-opacity=".08"/>
    <text x="680" y="91" fill="#111" font-family="Microsoft YaHei,Arial,sans-serif" font-size="10" font-weight="700">图层</text>
    <g transform="translate(676 108)">
      <rect width="142" height="47" rx="12" fill="#f2f2f3"/>
      <rect x="9" y="9" width="29" height="29" rx="8" fill="#f97316"/>
      <rect x="48" y="13" width="65" height="8" rx="4" fill="#111"/>
      <rect x="48" y="28" width="82" height="6" rx="3" fill="#111" opacity=".22"/>
      <rect y="57" width="142" height="47" rx="12" fill="#f7f7f7"/>
      <rect x="9" y="66" width="29" height="29" rx="8" fill="#ddd"/>
      <rect x="48" y="70" width="54" height="8" rx="4" fill="#111"/>
      <rect x="48" y="85" width="76" height="6" rx="3" fill="#111" opacity=".18"/>
      <rect y="114" width="142" height="47" rx="12" fill="#f7f7f7"/>
      <rect x="9" y="123" width="29" height="29" rx="8" fill="#111" opacity=".16"/>
      <rect x="48" y="127" width="73" height="8" rx="4" fill="#111"/>
      <rect x="48" y="142" width="58" height="6" rx="3" fill="#111" opacity=".18"/>
    </g>
  </g>

  <g transform="translate(56 578)" font-family="Microsoft YaHei,Arial,sans-serif">
    <g>
      <rect width="260" height="88" rx="22" fill="#fff" stroke="#000" stroke-opacity=".09"/>
      <circle cx="38" cy="44" r="19" fill="#111"/>
      <path d="M31 45h14m-7-7v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="68" y="39" fill="#111" font-size="13" font-weight="700">原图只保存一份</text>
      <text x="68" y="59" fill="#777" font-size="10">本机分块存储，不上传图片</text>
    </g>
    <g transform="translate(276)">
      <rect width="260" height="88" rx="22" fill="#fff" stroke="#000" stroke-opacity=".09"/>
      <circle cx="38" cy="44" r="19" fill="#f97316"/>
      <path d="m30 45 6 6 11-14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="39" fill="#111" font-size="13" font-weight="700">大图自动低清预览</text>
      <text x="68" y="59" fill="#777" font-size="10">导出时再读取原始尺寸</text>
    </g>
    <g transform="translate(552)">
      <rect width="296" height="88" rx="22" fill="#111"/>
      <circle cx="38" cy="44" r="19" fill="#fff"/>
      <rect x="29" y="34" width="18" height="20" rx="3" fill="none" stroke="#111" stroke-width="2"/>
      <text x="68" y="39" fill="#fff" font-size="13" font-weight="700">网页 + Windows 双版本</text>
      <text x="68" y="59" fill="#fff" fill-opacity=".55" font-size="10">同一套编辑核心，工程保持兼容</text>
    </g>
  </g>
</svg>
